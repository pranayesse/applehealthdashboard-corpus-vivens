<!doctype html>
<meta charset="utf-8">
<title>Corpus Vivens</title>
<style>
  :root{
    --ground:#DCE0DA; --paper:#E9ECE6; --ink:#26333A; --ink-soft:#5C6B72;
    --ink-faint:#8B989D; --rule:#B9C1BB; --carmine:#A8324A; --carmine-lift:#C24259;
    --rose:#B06B75; --tissue:#C9A7A6; --flesh:#CFD3CB;
    --serif:"Hoefler Text","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{width:640px;height:320px;overflow:hidden}
  body{background:var(--ground);font-family:var(--serif);color:var(--ink);
       display:grid;grid-template-columns:196px 1fr;align-items:center}
  .frame{position:absolute;inset:14px;border:1px solid var(--rule);pointer-events:none}
  .figwrap{display:flex;align-items:center;justify-content:center;height:100%;padding:16px 0 14px 18px}
  svg.fig{height:288px;width:auto;overflow:visible}
  .silhouette{fill:var(--flesh);stroke:var(--ink);stroke-width:1.05;stroke-opacity:.5}
  .hatch{fill:url(#h);opacity:.45}
  .organ-line{stroke:var(--ink);stroke-width:1;fill:none;opacity:.45}
  .copy{padding:0 34px 0 16px;display:grid;gap:11px;align-content:center}
  .eyebrow{font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;
           color:var(--ink-faint);display:flex;gap:14px}
  h1{font-style:italic;font-weight:400;font-size:47px;line-height:.95;letter-spacing:-.02em}
  .sub{font-size:14.5px;color:var(--ink-soft);line-height:1.35;max-width:30ch}
  ul{list-style:none;padding:0;display:grid;gap:5px;margin-top:3px}
  li{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;
     color:var(--ink-soft);display:flex;align-items:center;gap:8px}
  li i{width:5px;height:5px;border-radius:50%;background:var(--carmine);flex:none}
  .rule{height:1px;background:var(--rule);margin:2px 0}
</style>
